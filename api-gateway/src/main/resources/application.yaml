server:
  port: 8080

spring:
  application:
    name: gateway

gateway:
  ticketing-uri: http://localhost:8081
  notifications-uri: http://localhost:8082
  rate-limit:
    capacity: 20
    period: 10s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Every log line shows the request's correlation id, or nothing outside a request.
    level: "%5p [%X{correlationId:-}]"

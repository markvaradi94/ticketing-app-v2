server:
  port: 8081

spring:
  application:
    name: ticketing
  data:
    mongodb:
      auto-index-creation: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Every log line shows the request's correlation id, or nothing outside a request.
    level: "%5p [%X{correlationId:-}]"

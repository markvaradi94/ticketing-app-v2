name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Every job may read the repository, and nothing more, unless it asks for more itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - run: docker compose build

  # A green build on main deploys itself. The set-up behind it is in deploy/github-actions.md.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token that Workload Identity Federation exchanges; no key anywhere
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ticketing
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push the images, tagged with the commit
        run: |
          for service in ticketing-service notification-service api-gateway; do
            docker build -f "$service/Dockerfile" -t "$REPO/$service:$TAG" .
            docker push "$REPO/$service:$TAG"
          done

      # Only the image changes; each service keeps the configuration it was deployed with (deploy/cloud-run.md).
      # --to-latest undoes a rollback that pinned traffic to an older revision.
      - name: Deploy the new revisions
        run: |
          for service in notification-service ticketing-service api-gateway; do
            gcloud run deploy "$service" --image "$REPO/$service:$TAG" --quiet
            gcloud run services update-traffic "$service" --to-latest --quiet
          done

      - name: Smoke test through the public URL
        run: |
          url=$(gcloud run services describe api-gateway --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url/actuator/health"
          curl -fsS "$url/events" > /dev/null
          echo "Deployed $TAG, serving at $url"

server:
  port: 8082

spring:
  application:
    name: notification
  mongodb:
    database: notifications
  rabbitmq:
    listener:
      simple:
        # A message that fails is dead-lettered, never requeued in a loop.
        default-requeue-rejected: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Every log line shows the request's correlation id, or nothing outside a request.
    level: "%5p [%X{correlationId:-}]"
